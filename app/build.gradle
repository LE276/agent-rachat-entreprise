plugins { id 'com.android.application' }
android {
    namespace 'fr.ridecheck'
    compileSdk 34
    defaultConfig {
        applicationId 'fr.ridecheck'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }
    signingConfigs {
        fixe {
            storeFile file('ridecheck.jks')
            storePassword 'ridecheck123'
            keyAlias 'ridecheck'
            keyPassword 'ridecheck123'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.fixe }
        release { minifyEnabled false; signingConfig signingConfigs.fixe }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
