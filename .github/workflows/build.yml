name: Build APK
on:
  push:
    paths-ignore: ['RideCheck.apk']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle :app:assembleRelease --no-daemon
      - run: cp app/build/outputs/apk/release/app-release.apk RideCheck.apk
      - name: Publier l'APK dans la branche
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f RideCheck.apk
          git commit -m "APK RideCheck" || exit 0
          git push
